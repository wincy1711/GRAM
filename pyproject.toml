[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gram-reasoning"
version = "0.1.0"
description = "Generative Recursive reAsoning Models (GRAM)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["torch>=2.1", "numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["gram*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
